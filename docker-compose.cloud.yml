# Cloud deployment override — use with:
#   docker compose -f docker-compose.prod.yml -f docker-compose.cloud.yml up -d
#
# Expects managed database and Redis URLs in .env

services:
  # Disable local DB in cloud (use managed service)
  db:
    profiles: ["local-only"]

  # Disable local Redis in cloud (use managed service)
  redis:
    profiles: ["local-only"]

  backend:
    environment:
      - DATABASE_URL=${CLOUD_DATABASE_URL}
      - REDIS_URL=${CLOUD_REDIS_URL}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot
    container_name: pawpalja-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./frontend/dist:/usr/share/nginx/html:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /usr/share/nginx/html; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - pawpalja-network

volumes:
  certbot-etc:
  certbot-var:
