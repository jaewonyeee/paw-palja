# Cloud deployment override — use with:
#   docker compose -f docker-compose.prod.yml -f docker-compose.cloud.yml up -d
#
# Expects managed database and Redis URLs in .env

services:
  # Disable local DB in cloud (use managed service)
  db:
    profiles: ["local-only"]

  # Disable local Redis in cloud (use managed service)
  redis:
    profiles: ["local-only"]

  backend:
    depends_on: {}
    environment:
      - DATABASE_URL=${CLOUD_DATABASE_URL}
      - REDIS_URL=${CLOUD_REDIS_URL}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DATABASE_URL=${CLOUD_DATABASE_URL}
      - REDIS_URL=${CLOUD_REDIS_URL}
      - USE_TASK_QUEUE=true

  nginx:
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot
    container_name: pawpalja-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - pawpalja-network

volumes:
  certbot-etc:
  certbot-var:
  certbot-webroot:
