<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#6C5CE7"/>
  <!-- Face -->
  <circle cx="96" cy="102" r="52" fill="#F0A04B"/>
  <!-- Left ear (floppy) -->
  <ellipse cx="58" cy="62" rx="22" ry="34" transform="rotate(-15 58 62)" fill="#D48B3A"/>
  <!-- Right ear (floppy) -->
  <ellipse cx="134" cy="62" rx="22" ry="34" transform="rotate(15 134 62)" fill="#D48B3A"/>
  <!-- Left eye -->
  <circle cx="78" cy="95" r="8" fill="#2D2016"/>
  <circle cx="81" cy="92" r="3" fill="white"/>
  <!-- Right eye -->
  <circle cx="114" cy="95" r="8" fill="#2D2016"/>
  <circle cx="117" cy="92" r="3" fill="white"/>
  <!-- Nose -->
  <ellipse cx="96" cy="115" rx="8" ry="6" fill="#2D2016"/>
  <!-- Mouth -->
  <path d="M88 121 Q96 129 104 121" stroke="#2D2016" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="96" cy="128" rx="5" ry="6" fill="#FDA4AF"/>
  <!-- Cheeks -->
  <circle cx="68" cy="110" r="7" fill="#F8C97D" opacity="0.6"/>
  <circle cx="124" cy="110" r="7" fill="#F8C97D" opacity="0.6"/>
</svg>
