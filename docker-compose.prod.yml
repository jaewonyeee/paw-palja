services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: pawpalja-db
    environment:
      POSTGRES_DB: pawpalja
      POSTGRES_USER: pawpalja
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawpalja"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pawpalja-network

  # Redis (rate limiting + caching)
  redis:
    image: redis:7-alpine
    container_name: pawpalja-redis
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pawpalja-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pawpalja/backend:latest
    container_name: pawpalja-backend
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://pawpalja:${DB_PASSWORD}@db:5432/pawpalja
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pawpalja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ARQ Worker (async LLM agent task queue)
  worker:
    image: pawpalja/backend:latest
    container_name: pawpalja-worker
    command: ["python", "-m", "arq", "backend.worker.WorkerSettings"]
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://pawpalja:${DB_PASSWORD}@db:5432/pawpalja
      - REDIS_URL=redis://redis:6379/0
      - USE_TASK_QUEUE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pawpalja-network

  # Nginx (frontend serving + reverse proxy)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: pawpalja/nginx:latest
    container_name: pawpalja-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pawpalja-network

volumes:
  pgdata:
  redisdata:

networks:
  pawpalja-network:
    driver: bridge
