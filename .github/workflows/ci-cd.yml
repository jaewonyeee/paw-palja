name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend lint check
  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install flake8
    - name: Lint
      run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

  # Frontend build check
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: cd frontend && npm ci && npm run build

  # Deploy backend to EC2 (only on push to main)
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/pawpalja

          # Pull latest code
          git pull --ff-only

          # Rebuild and restart backend
          docker compose -f docker-compose.ec2.yml build --no-cache backend
          docker compose -f docker-compose.ec2.yml up -d

          # Wait and health check
          sleep 15
          curl -sf http://localhost:8000/health || echo "WARNING: Health check failed"

          # Cleanup old images
          docker image prune -f
